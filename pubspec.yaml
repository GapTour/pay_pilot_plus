name: pay_pilot_plus
description: "an app to manage your member's payments"
version: 1.0.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  get_it: ^9.2.1
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  equatable: ^2.1.0
  collection: ^1.19.1
  window_manager: ^0.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  gap: ^3.0.1
  clay_containers: ^0.3.4
  persian_calendar_widget: ^0.7.0
  file_picker: ^12.1.2
  share_plus: ^13.3.0
  intl_utils: ^2.8.14
  drift: ^2.28.1
  drift_flutter: ^0.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.7.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: IRANSansX
      fonts:
        - asset: assets/fonts/IRANSansX-Regular.ttf
        - asset: assets/fonts/IRANSansX-Medium.ttf
        - asset: assets/fonts/IRANSansX-Bold.ttf

flutter_intl:
  enabled: true
  # class_name: S
  main_locale: fa
  arb_dir: lib/core/l10n
  output_dir: lib/core/l10n/generated
