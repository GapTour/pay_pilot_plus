name: Build macOS and Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - run: flutter pub get

      - run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          brew install create-dmg
          DMG_PATH=$(./scripts/build_macos_dmg.sh)
          echo "MACOS_DMG=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ env.MACOS_DMG }}
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools ndk;29.0.13113456"
          accept-android-sdk-licenses: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/pay-pilot-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/pay-pilot-android.apk
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-app/*.dmg
            android-apk/*.apk
